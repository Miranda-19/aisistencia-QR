<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control de Asistencia QR</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
    :root {
        --primary: #1a73e8;
        --primary-dark: #1557b0;
        --success: #0d9f6e;
        --warning: #e6a700;
        --error: #d93025;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --border: #334155;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        line-height: 1.4;
    }

    .contenedor {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border: 1px solid var(--border);
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #1a73e8, #0d47a1);
        padding: 28px 24px 24px;
        text-align: center;
        position: relative;
    }

    .header::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 20px;
        background: var(--card);
        border-radius: 20px 20px 0 0;
    }

    .logo {
        font-size: 32px;
        margin-bottom: 8px;
    }

    h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin-bottom: 4px;
    }

    .subtitulo {
        font-size: 13px;
        opacity: 0.9;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    /* Body */
    .body {
        padding: 8px 24px 28px;
    }

    /* Botón principal */
    #botonCamara {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        background: var(--primary);
        color: white;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
    }

    #botonCamara:hover:not(:disabled) {
        background: var(--primary-dark);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(26, 115, 232, 0.45);
    }

    #botonCamara:active:not(:disabled) {
        transform: translateY(0);
    }

    #botonCamara:disabled {
        background: #334155;
        color: #94a3b8;
        cursor: not-allowed;
        box-shadow: none;
    }

    #botonCamara.activa {
        background: #0d9f6e;
        box-shadow: 0 4px 14px rgba(13, 159, 110, 0.35);
    }

    /* Lector QR */
    #reader {
        width: 100%;
        margin: 20px 0 8px;
        border-radius: 16px;
        overflow: hidden;
        background: #0f172a;
        border: 1px solid var(--border);
    }

    #reader video {
        border-radius: 16px !important;
    }

    /* Resultado */
    #resultado {
        margin-top: 8px;
        padding: 22px 18px;
        border-radius: 16px;
        text-align: center;
        transition: all 0.3s ease;
        border: 1px solid transparent;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #resultado.aviso {
        background: rgba(230, 167, 0, 0.12);
        border-color: rgba(230, 167, 0, 0.25);
        color: #fbbf24;
    }

    #resultado.ok {
        background: rgba(13, 159, 110, 0.15);
        border-color: rgba(13, 159, 110, 0.3);
        color: #34d399;
        animation: successPulse 0.5s ease;
    }

    #resultado.error {
        background: rgba(217, 48, 37, 0.15);
        border-color: rgba(217, 48, 37, 0.3);
        color: #f87171;
        animation: shake 0.4s ease;
    }

    .estado {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: -0.2px;
    }

    .nombre {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        margin-top: 4px;
        line-height: 1.3;
    }

    .hora {
        font-size: 15px;
        color: var(--text-muted);
        margin-top: 8px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
    }

    /* Animaciones */
    @keyframes successPulse {
        0% { transform: scale(0.96); opacity: 0.7; }
        50% { transform: scale(1.02); }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }

    /* Footer sutil */
    .footer {
        text-align: center;
        padding: 0 24px 20px;
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 0.3px;
    }

    /* Responsive */
    @media (max-width: 380px) {
        .header { padding: 24px 20px 20px; }
        .body { padding: 8px 18px 24px; }
        h1 { font-size: 20px; }
    }
</style>
</head>
<body>
<div class="contenedor">
    <div class="header">
        <div class="logo">📱</div>
        <h1>Control de Asistencia</h1>
        <div class="subtitulo">Lector QR Profesional</div>
    </div>

    <div class="body">
        <button id="botonCamara" onclick="iniciarCamara()">
            <span>📷</span>
            <span>ACTIVAR CÁMARA</span>
        </button>

        <div id="reader"></div>

        <div id="resultado" class="aviso">
            <div class="estado">Presione el botón para comenzar</div>
        </div>
    </div>

    <div class="footer">
        Sistema de registro de asistencia
    </div>
</div>

<script>
// ============================================================
// URL DE TU APPS SCRIPT
// ============================================================
const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwr30ZiL8XXC3kXs_-Sb-EjUAqflNtyOqBIhCz-MEz0CrXBF-wFL5Zr0IxG7pnXPkMk/exec";

let lector = null;
let procesando = false;

// ============================================================
// ACTIVAR CÁMARA
// ============================================================
async function iniciarCamara() {
    const boton = document.getElementById("botonCamara");
    boton.disabled = true;
    boton.innerHTML = "<span>⏳</span><span>ACTIVANDO CÁMARA...</span>";

    try {
        // Solicitar permiso de cámara
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
        });
        stream.getTracks().forEach(track => track.stop());

        lector = new Html5Qrcode("reader");

        await lector.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            },
            codigoQR => {
                procesarQR(codigoQR);
            },
            error => {
                // Errores normales de lectura (ignorar)
            }
        );

        boton.innerHTML = "<span>🟢</span><span>CÁMARA ACTIVA</span>";
        boton.classList.add("activa");

        mostrarMensaje("AVISO", "Apunte el código QR al recuadro", "", "");
    } catch (error) {
        console.error(error);
        boton.disabled = false;
        boton.innerHTML = "<span>📷</span><span>ACTIVAR CÁMARA</span>";
        boton.classList.remove("activa");

        mostrarMensaje("ERROR", "No se pudo activar la cámara", "", "");
        hablar("No se pudo activar la cámara");
    }
}

// ============================================================
// PROCESAR QR
// ============================================================
function procesarQR(codigo) {
    if (procesando) return;

    procesando = true;
    const ci = String(codigo).trim();

    if (ci === "") {
        procesando = false;
        return;
    }

    if (lector) {
        lector.pause(true);
    }

    mostrarMensaje("AVISO", "Verificando asistencia...", "", "");
    enviarCI(ci);
}

// ============================================================
// ENVIAR C.I.
// ============================================================
function enviarCI(ci) {
    const callbackName = "respuestaQR_" + Date.now();

    window[callbackName] = function(respuesta) {
        try {
            mostrarResultado(respuesta);
        } finally {
            delete window[callbackName];
            setTimeout(function() {
                procesando = false;
                if (lector) {
                    lector.resume();
                }
            }, 3000);
        }
    };

    const script = document.createElement("script");
    script.src = URL_APPS_SCRIPT +
        "?ci=" + encodeURIComponent(ci) +
        "&callback=" + callbackName;

    script.onerror = function() {
        mostrarMensaje("ERROR", "Error de conexión con el sistema", "", "");
        hablar("Error de conexión con el sistema");
        delete window[callbackName];

        setTimeout(function() {
            procesando = false;
            if (lector) {
                lector.resume();
            }
        }, 3000);
    };

    document.body.appendChild(script);
}

// ============================================================
// MOSTRAR RESULTADO
// ============================================================
function mostrarResultado(respuesta) {
    if (!respuesta) {
        mostrarMensaje("ERROR", "Sin respuesta del sistema", "", "");
        hablar("Sin respuesta del sistema");
        return;
    }

    if (respuesta.estado === "OK") {
        mostrarMensaje(
            "OK",
            "✅ Asistencia registrada",
            respuesta.nombre,
            respuesta.hora
        );
        hablar("Asistencia registrada. " + respuesta.nombre);
        return;
    }

    if (respuesta.estado === "YA") {
        mostrarMensaje(
            "AVISO",
            "⚠️ Asistencia ya registrada",
            respuesta.nombre,
            ""
        );
        hablar("Asistencia ya registrada. " + respuesta.nombre);
        return;
    }

    if (respuesta.estado === "FUERA") {
        mostrarMensaje(
            "AVISO",
            "⏰ Fuera del horario permitido",
            respuesta.nombre,
            ""
        );
        hablar("Fuera del horario. " + respuesta.nombre);
        return;
    }

    mostrarMensaje(
        "ERROR",
        "❌ " + (respuesta.mensaje || "Error desconocido"),
        "",
        ""
    );
    hablar(respuesta.mensaje || "Error");
}

// ============================================================
// MOSTRAR MENSAJE
// ============================================================
function mostrarMensaje(tipo, mensaje, nombre, hora) {
    const resultado = document.getElementById("resultado");
    resultado.className = "";

    if (tipo === "OK") {
        resultado.classList.add("ok");
    } else if (tipo === "ERROR") {
        resultado.classList.add("error");
    } else {
        resultado.classList.add("aviso");
    }

    let html = `<div class="estado">${mensaje}</div>`;

    if (nombre) {
        html += `<div class="nombre">${nombre}</div>`;
    }

    if (hora) {
        html += `<div class="hora">🕐 ${hora}</div>`;
    }

    resultado.innerHTML = html;
}

// ============================================================
// VOZ
// ============================================================
function hablar(texto) {
    try {
        if (!("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = "es-ES";
        voz.rate = 0.95;
        voz.pitch = 1;
        window.speechSynthesis.speak(voz);
    } catch (error) {
        console.log(error);
    }
}
</script>
</body>
</html>
